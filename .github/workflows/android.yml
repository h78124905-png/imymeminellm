name: Android APK

on:
  push:
    branches: [main, p1-setup]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          cd "$SDK_ROOT/cmdline-tools"
          curl -sSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf latest cmdline-tools
          unzip -q cmdtools.zip
          mv cmdline-tools latest
          rm cmdtools.zip
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"
          yes 2>/dev/null | sdkmanager --licenses > /dev/null || true
          if ! sdkmanager "platform-tools" \
                         "platforms;android-34" \
                         "build-tools;34.0.0" \
                         "ndk;26.1.10909125" \
                         "cmake;3.24.1"; then
            curl -sSL -o cmake.tar.gz https://github.com/Kitware/CMake/releases/download/v3.24.1/cmake-3.24.1-linux-x86_64.tar.gz
            tar xzf cmake.tar.gz -C /opt
            echo "/opt/cmake-3.24.1-linux-x86_64/bin" >> "$GITHUB_PATH"
            rm cmake.tar.gz
          fi
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: agentllm-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
